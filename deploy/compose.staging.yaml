name: petbaby-staging

# 测试机编排：宿主机 Nginx 终止 HTTPS → web(Next.js) → PostgreSQL 17，worker 共享同一镜像。
# 与 compose.production.yaml 的差别：对象存储落在共享卷 object-data 上，web 只发布到宿主机回环地址。
x-app: &app
  image: ${PETBABY_IMAGE:-petbaby-platform:staging}
  build:
    context: ../apps/platform
    args:
      NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
      PNPM_VERSION: ${PNPM_VERSION:-10.13.1}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
  env_file:
    - .env.staging
  volumes:
    - object-data:/app/.data/objects
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 2g
    cpus: 1.5

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    mem_limit: 3g
    cpus: 2.0

volumes:
  postgres-data:
  object-data:
