# 宿主机 Nginx 配置示例，staging 与 production 通用。
# 生产接口域名 api.babykitty.cn；如果 APP_PORT 不是 3000，同时修改 proxy_pass。

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.babykitty.cn;

    # 保留 ACME 路径，将来改用 Certbot 时可直接签发。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.babykitty.cn;

    # 证书由腾讯云签发（TrustAsia DV），手工上传；到期前替换这两份文件后 nginx -s reload。
    ssl_certificate /etc/nginx/ssl/api.babykitty.cn/api.babykitty.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.babykitty.cn/api.babykitty.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/petbaby.access.log;
    error_log /var/log/nginx/petbaby.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
