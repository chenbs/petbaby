services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petbaby
      POSTGRES_USER: petbaby
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petbaby"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - petbaby-db:/var/lib/postgresql/data
  web:
    build: ./apps/platform
    environment:
      DATABASE_URL: postgres://petbaby:local-only-change-me@db:5432/petbaby
      SESSION_SECRET: local-compose-secret-change-before-production-123456
      WORKER_SECRET: local-worker-secret-change-before-production
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: ./apps/platform
    command: ["pnpm", "worker"]
    environment:
      DATABASE_URL: postgres://petbaby:local-only-change-me@db:5432/petbaby
      SESSION_SECRET: local-compose-secret-change-before-production-123456
    depends_on:
      db: { condition: service_healthy }
volumes:
  petbaby-db:
