  <style>
    * { box-sizing: border-box; }

    img { display: block; width: 100%; height: auto; background: #e7eeea; }
    figcaption { display: grid; gap: 4px; padding: 12px 14px 14px; }
    strong { font-size: 15px; }
    small { color: #52615b; font-size: 12px; }
