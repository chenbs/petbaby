name: petbaby-production

x-app: &app
  image: ${PETBABY_IMAGE}
  build:
    context: ../apps/platform
    args:
      NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
      PNPM_VERSION: ${PNPM_VERSION:-10.13.1}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
  env_file:
    - .env.production
  environment:
    DATABASE_URL: ${DATABASE_URL}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    mem_limit: 3g
    cpus: 2.0

volumes:
  postgres-data:
