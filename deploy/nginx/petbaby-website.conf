# 独立官网（apps/website 的静态产物）的宿主机 Nginx 配置。
# 与 petbaby.conf 并列，互不影响 —— 官网发布不碰 Docker、不重启容器、不跑迁移。
#
# 使用前替换 petbaby.example.com。主域给官网、应用挪到 app. 子域：搜索流量的
# 落地页是官网（方案 1 章）。应用侧的连带改动见方案第 9 章，漏了会出故障：
#   · deploy/.env.{staging,production} 的 PUBLIC_APP_URL 改成 app. 子域
#     （/api/plugins 出口按它补样例图绝对域名；小程序 <image src> 遇到以 / 开头
#     的值会当主包内本地文件找，必然裂图）
#   · petbaby.conf 的 server_name 改成 app.petbaby.example.com
#   · 证书要覆盖 app. 子域（或直接上通配证书）
#   · 微信商户平台的支付回调地址与授权域名白名单
#   · 微信公众平台的小程序 request 服务器域名白名单

server {
    listen 80;
    listen [::]:80;
    server_name petbaby.example.com www.petbaby.example.com;

    # Certbot 首次申请证书时需要保留 HTTP；签发后可由 Certbot 自动添加跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://petbaby.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name petbaby.example.com;

    ssl_certificate /etc/letsencrypt/live/petbaby.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petbaby.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # current 是指向 releases/<时间戳>/ 的软链，由 release-website.sh 原子切换。
    root /srv/petbaby-website/current;
    index index.html;

    access_log /var/log/nginx/petbaby-website.access.log;
    error_log /var/log/nginx/petbaby-website.error.log warn;

    # 纯静态站，没有服务端逻辑，但仍给基础安全头。
    # 注意 CSP 与 apps/platform 的 next.config.ts 各自独立 —— 官网接第三方统计
    # 之类只改这里，不影响应用（这是独立站的收益之一，方案 1 章第 3 条）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/xml application/rss+xml image/svg+xml;

    # trailingSlash: 'always' 对应的解析规则。$uri/index.html 这一档是关键 ——
    # 产物是目录式的（/blog/foo/index.html），少了它 /blog/foo/ 会 404。
    location / {
        try_files $uri $uri/index.html =404;
    }

    # 素材只给 7 天而非一年：原型的素材文件名不带内容哈希（work-golden.jpg 这种），
    # 换图后文件名不变，长缓存会让用户看到旧图。
    # 若日后给素材加哈希文件名，可以延长到一年。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Astro 产出的 /_astro/ 下的文件名带内容哈希，可以长缓存 + immutable。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML 不缓存，保证发布后立即生效。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # sitemap / rss / robots / llms 也不缓存：它们随文章发布而变，
    # 且体积很小，缓存收益不值得让爬虫读到旧清单。
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
}

# www 301 到主域（择一为规范域，另一个永久跳转）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.petbaby.example.com;

    ssl_certificate /etc/letsencrypt/live/petbaby.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petbaby.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://petbaby.example.com$request_uri;
}
